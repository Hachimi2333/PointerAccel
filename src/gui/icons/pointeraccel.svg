      <stop stop-color="#2455d6"/>
      <stop offset="0.52" stop-color="#168de2"/>
      <stop offset="1" stop-color="#18c6cf"/>
    </linearGradient>
    <linearGradient id="pointer" x1="160" y1="120" x2="300" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9faff"/>
