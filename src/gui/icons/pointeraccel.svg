  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#background)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>
  <g fill="none" stroke="#c4faff" stroke-width="18" stroke-linecap="round">
